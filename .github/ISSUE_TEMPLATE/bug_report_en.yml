name: Bug report (English)
description: Report bugs or compatibility issues without exposing private data
title: "[Bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: tool
    attributes:
      label: Affected utility
      options:
        - Antigravity translation launcher
        - Antigravity usage HUD
        - ChatGPT / Codex usage HUD
        - Other
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Environment
      description: Windows, desktop app, Node.js, and Python versions as applicable
      placeholder: "Windows 11 24H2, app x.y, Node.js 22, Python 3.12"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide minimal steps without account, conversation or session data
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Expected vs actual result
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted error details (optional)
      description: Never upload raw sessions, databases, tokens, cookies, paths or unredacted reports
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have removed credentials, sessions, personal data and unredacted logs.
          required: true
