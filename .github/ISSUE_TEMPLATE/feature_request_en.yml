name: Feature request (English)
description: Suggest a focused improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: dropdown
    id: tool
    attributes:
      label: Target utility
      options:
        - Antigravity translation launcher
        - Antigravity usage HUD
        - ChatGPT / Codex usage HUD
        - Cross-tool / Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem and use case
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution and alternatives
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Security, privacy and compatibility concerns
