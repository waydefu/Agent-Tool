name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  validate-linux:
    name: validate-linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Python 語法與單元測試
        run: |
          python -m compileall -q agy-cache-watch codex-cache-watch tests
          python -m unittest discover -s tests -p "test_*.py" -v
          python -I agy-cache-watch/agy_cache.py --selftest
          python -I codex-cache-watch/codex_cache.py --selftest
      - name: Dev Container 安裝腳本語法檢查
        run: bash -n .devcontainer/setup-tools.sh
      - name: JavaScript 語法與注入目標測試
        run: |
          node --check antigravity-zh-tw/launch-zh-tw.js
          node --check antigravity-zh-tw/merge-extra.js
          node --check antigravity-zh-tw/src/locale.js
          node --check agy-cache-watch/hud.js
          node --check codex-cache-watch/hud.js
          node --check codex-cache-watch/launch-codex-hud.js
          node --test
          node -e "require('./antigravity-zh-tw/src/locale').loadLocale('zh-TW')"

  validate-windows:
    name: validate-windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Windows Python / JavaScript / locale
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I agy-cache-watch/agy_cache.py --selftest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I codex-cache-watch/codex_cache.py --selftest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node -e "require('./antigravity-zh-tw/src/locale').loadLocale('zh-TW')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows PowerShell 語法檢查（不執行行程關閉或驗證）
        shell: pwsh
        run: |
          foreach ($script in @('codex-cache-watch/SafeClose-Codex.ps1', 'shared/Verify-CdpOwner.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -ne 0) {
              $parseErrors | Format-List | Out-String | Write-Error
              exit 1
            }
          }
          Write-Output 'PowerShell syntax OK'
